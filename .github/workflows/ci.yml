name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    name: Contracts (Foundry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Build
        working-directory: contracts
        run: forge build --sizes
      - name: Test (incl. fuzz)
        working-directory: contracts
        run: forge test -vv

  app:
    name: Web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build contracts and export ABIs
        run: cd contracts && forge build && cd .. && npm run export
      - name: Typecheck and build
        run: npm --workspace app run build
