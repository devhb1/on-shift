<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Check whether a staff member or AI agent is really on shift for onshift.eth. Expiring authority on Ethereum Sepolia." />
    <meta property="og:title" content="OnShift" />
    <meta property="og:description" content="Check whether someone is really on shift for onshift.eth. The answer is read from Ethereum Sepolia." />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#0B1430" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>OnShift — Authority that clocks out</title>
    <script>
      try {
        var t = localStorage.getItem("onshift.theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <main style="font-family: system-ui, sans-serif; max-width: 32rem; margin: 4rem auto; padding: 0 1.25rem; line-height: 1.5;">
        <h1>OnShift needs JavaScript</h1>
        <p>This app reads ENSv2 on Sepolia in the browser. Allow scripts for this site (in Brave: Shields → allow scripts), then reload.</p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
